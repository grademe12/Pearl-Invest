---
# ================== Auth Service Deployment ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pearl-auth
  namespace: pearl-invest
  labels:
    app: pearl-auth
    service: authentication
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pearl-auth
  template:
    metadata:
      labels:
        app: pearl-auth
        service: authentication
        tier: backend
    spec:
      containers:
      - name: pearl-auth
        image: pearl-invest/debian-slim:v2.0
        imagePullPolicy: Never
        ports:
        - containerPort: 80
          name: http
        env:
        - name: SERVICE_NAME
          value: "auth-service"
        volumeMounts:
        - name: common-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: common-config
          mountPath: /etc/supervisor/conf.d/supervisord.conf
          subPath: supervisord.conf
        - name: auth-config
          mountPath: /etc/teleport/teleport.yaml
          subPath: teleport.yaml
        - name: teleport-data
          mountPath: /var/lib/teleport
        - name: teleport-token
          mountPath: /etc/teleport/secrets
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: teleport-token
        secret:
          secretName: teleport-join-token
          items:
          - key: token
            path: auth-token
      - name: common-config
        configMap:
          name: pearl-common-config
      - name: auth-config
        configMap:
          name: auth-service-config
      - name: teleport-data
        emptyDir: {}
---

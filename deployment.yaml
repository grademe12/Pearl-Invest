apiVersion: v1
kind: Namespace
metadata:
  name: pearl-invest
---
# ================== 공통 ConfigMap ==================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pearl-common-config
  namespace: pearl-invest
data:
  nginx.conf: |
    user www-data;
    worker_processes auto;
    pid /run/nginx.pid;
    
    events {
        worker_connections 1024;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        log_format teleport '$remote_addr [$time_local] "$request" $status '
                           'teleport_user="$http_x_teleport_user"';
        
        access_log /var/log/nginx/access.log teleport;
        error_log /var/log/nginx/error.log;
        
        server {
            listen 80;
            server_name _;
            
            location /health {
                access_log off;
                return 200 "OK\n";
                add_header Content-Type text/plain;
            }
            
            location / {
                return 200 '{"service":"pearl-invest","status":"running","user":"$http_x_teleport_user"}';
                add_header Content-Type application/json;
            }
        }
    }
  
  supervisord.conf: |
    [unix_http_server]
    file=/run/supervisord.sock
    
    [supervisord]
    nodaemon=true
    user=root
    logfile=/var/log/supervisor/supervisord.log
    pidfile=/run/supervisord.pid
    
    [rpcinterface:supervisor]
    supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
    
    [supervisorctl]
    serverurl=unix:///run/supervisord.sock
    
    [program:nginx]
    command=/usr/sbin/nginx -g "daemon off;"
    autostart=true
    autorestart=true
    stdout_logfile=/var/log/nginx/stdout.log
    stderr_logfile=/var/log/nginx/stderr.log
    
    [program:teleport]
    command=/usr/local/bin/teleport start --config=/etc/teleport/teleport.yaml
    autostart=true
    autorestart=true
    stdout_logfile=/var/log/teleport/stdout.log
    stderr_logfile=/var/log/teleport/stderr.log
    environment=HOME="/var/lib/teleport"
---
# ================== Auth Service ConfigMap ==================
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: pearl-invest
data:
  teleport.yaml: |
    version: v3
    teleport:
      nodename: pearl-auth-node
      data_dir: /var/lib/teleport
      auth_token: /etc/teleport/secrets/auth-token
      proxy_server: teleport.pearlinvest.click:443
      log:
        output: stdout
        severity: INFO
    
    auth_service:
      enabled: false
    
    ssh_service:
      enabled: true
      labels:
        app: pearl-invest
        service: auth
        env: production
    
    proxy_service:
      enabled: false
    
    app_service:
      enabled: false
      apps:
      - name: "pearl-auth"
        uri: "http://localhost:80"
        labels:
          env: production
          service: authentication
          tier: backend
          critical: true
---

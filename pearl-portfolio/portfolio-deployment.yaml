---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pearl-portfolio-api
  namespace: pearl-invest
  labels:
    app: pearl-portfolio
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pearl-portfolio
  template:
    metadata:
      labels:
        app: pearl-portfolio
        version: v2
    spec:
      containers:
      - name: portfolio-api
        image: pearl-portfolio-api:v2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SERVICE_PORT
          value: "8081"
        - name: AUTH_SERVICE_URL
          value: "http://pearl-auth-internal:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pearl-portfolio-service
  namespace: pearl-invest
  labels:
    app: pearl-portfolio
spec:
  type: NodePort
  selector:
    app: pearl-portfolio
  ports:
  - port: 8082
    targetPort: 8081
    nodePort: 30082
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: pearl-portfolio-internal
  namespace: pearl-invest
  labels:
    app: pearl-portfolio
spec:
  type: ClusterIP
  selector:
    app: pearl-portfolio
  ports:
  - port: 8081
    targetPort: 8081
    name: http
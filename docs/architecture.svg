<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Pearl Invest v1.0 구성도: 관리자는 tsh나 웹 UI로 AWS EC2의 Teleport에 로그인합니다. 라즈베리파이 K3s의 auth, trading, portfolio 파드는 각각 NGINX와 Teleport 에이전트를 함께 띄우고, 에이전트가 먼저 Teleport에 연결합니다. Teleport 역할은 service 라벨로 접근할 수 있는 파드를 정하고 세션을 녹화합니다.">
<rect width="640" height="380" fill="#fff"></rect>

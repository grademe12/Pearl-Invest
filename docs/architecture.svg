<rect width="640" height="380" fill="url(#pearlv1-grid)"></rect>
<rect x="200" y="150" width="420" height="200" fill="none" stroke="#8d8d8d" stroke-width="1"></rect>
<path d="M120 84 H220" fill="none" stroke="#d1621f" stroke-width="4"></path>
<path d="M300 108 V140 H520 V170 M300 140 V170 M410 140 V170" fill="none" stroke="#0f62fe" stroke-width="3" stroke-dasharray="8 5"></path>
